<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 740" width="1680" height="740">
  <!-- D2: end-to-end vs modular (slide 1.2). Sized to the full content area (1680x740 px on the
       1920x1080 canvas), so 1 px here = 0.75 pt on the slide. Colours follow the deck convention:
       blue = classical, orange = learned, dark = opaque network, grey = data.
       Examples = ch1 §1.1 citations (PointNet family omitted: our classifier is one).
       Lane 2 = the eight steps of S1 notes A5 (ch3 fig:architecture / fig:pipeline). -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3E4C59"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9822B"/>
    </marker>
  </defs>
  <g font-family="Be Vietnam Pro, Inter, Segoe UI, Arial, sans-serif" fill="#1F2933">

    <!-- ===================== LANE 1: END-TO-END ===================== -->
    <text x="30" y="56" font-size="30" font-weight="700">END-TO-END NETWORK</text>
    <text x="880" y="40" font-size="26" fill="#D7263D" font-weight="600" text-anchor="middle">dense manual labels: a class per point, or a 3D box per object</text>
    <line x1="880" y1="52" x2="880" y2="96" stroke="#D7263D" stroke-width="4" marker-end="url(#arr)"/>

    <!-- input -->
    <rect x="30" y="100" width="140" height="120" rx="14" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="3"/>
    <text x="100" y="153" font-size="24" text-anchor="middle">Raw</text>
    <text x="100" y="183" font-size="24" text-anchor="middle">scan</text>
    <line x1="170" y1="160" x2="206" y2="160" stroke="#3E4C59" stroke-width="4" marker-end="url(#arr)"/>

    <!-- the black box -->
    <rect x="210" y="100" width="1220" height="120" rx="14" fill="#1F2933"/>
    <text x="820" y="150" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">ONE DEEP NETWORK</text>
    <text x="820" y="190" font-size="24" fill="#D1D5DB" text-anchor="middle">e.g. RangeNet++, Cylinder3D (segmentation)  ·  PointPillars, CenterPoint (detection)</text>

    <!-- output -->
    <line x1="1430" y1="160" x2="1466" y2="160" stroke="#3E4C59" stroke-width="4" marker-end="url(#arr)"/>
    <rect x="1470" y="100" width="180" height="120" rx="14" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="3"/>
    <text x="1560" y="153" font-size="24" text-anchor="middle">Labels</text>
    <text x="1560" y="183" font-size="24" text-anchor="middle">or boxes</text>

    <!-- pros / cons -->
    <g font-size="26">
      <text x="210" y="272"><tspan fill="#2E7D32" font-weight="700">✓</tspan> Highest accuracy</text>
      <text x="560" y="272"><tspan fill="#D7263D" font-weight="700">✗</tspan> Needs dense manual labels</text>
      <text x="1010" y="272"><tspan fill="#D7263D" font-weight="700">✗</tspan> A missed car can't be traced to one step</text>
    </g>

    <line x1="30" y1="318" x2="1650" y2="318" stroke="#D1D5DB" stroke-width="3" stroke-dasharray="10 8"/>

    <!-- ===================== LANE 2: MODULAR ===================== -->
    <text x="30" y="380" font-size="30" font-weight="700">MODULAR PIPELINE (THIS THESIS)</text>

    <!-- input -->
    <rect x="30" y="410" width="140" height="120" rx="14" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="3"/>
    <text x="100" y="463" font-size="24" text-anchor="middle">Raw</text>
    <text x="100" y="493" font-size="24" text-anchor="middle">scan</text>
    <line x1="170" y1="470" x2="206" y2="470" stroke="#3E4C59" stroke-width="4" marker-end="url(#arr)"/>

    <!-- eight steps: x = 210 + i*155, w = 135 -->
    <g stroke-width="3">
      <rect x="210"  y="410" width="135" height="120" rx="12" fill="#DCE8F5" stroke="#2B5C8A"/>
      <rect x="365"  y="410" width="135" height="120" rx="12" fill="#DCE8F5" stroke="#2B5C8A"/>
      <rect x="520"  y="410" width="135" height="120" rx="12" fill="#DCE8F5" stroke="#2B5C8A"/>
      <rect x="675"  y="410" width="135" height="120" rx="12" fill="#DCE8F5" stroke="#2B5C8A"/>
      <rect x="830"  y="410" width="135" height="120" rx="12" fill="#FDE6CC" stroke="#D9822B"/>
      <rect x="985"  y="410" width="135" height="120" rx="12" fill="#DCE8F5" stroke="#2B5C8A"/>
      <rect x="1140" y="410" width="135" height="120" rx="12" fill="#DCE8F5" stroke="#2B5C8A"/>
      <rect x="1295" y="410" width="135" height="120" rx="12" fill="#FDE6CC" stroke="#D9822B"/>
    </g>
    <!-- arrows between steps -->
    <g stroke="#3E4C59" stroke-width="3" marker-end="url(#arr)">
      <line x1="345"  y1="470" x2="363"  y2="470"/>
      <line x1="500"  y1="470" x2="518"  y2="470"/>
      <line x1="655"  y1="470" x2="673"  y2="470"/>
      <line x1="810"  y1="470" x2="828"  y2="470"/>
      <line x1="965"  y1="470" x2="983"  y2="470"/>
      <line x1="1120" y1="470" x2="1138" y2="470"/>
      <line x1="1275" y1="470" x2="1293" y2="470"/>
    </g>
    <!-- step labels -->
    <g font-size="22" text-anchor="middle">
      <text x="277.5"  y="478">Preprocess</text>
      <text x="432.5"  y="463">Ground</text><text x="432.5" y="491">removal</text>
      <text x="587.5"  y="478">Clustering</text>
      <text x="742.5"  y="463">Geometric</text><text x="742.5" y="491">filter</text>
      <text x="897.5"  y="478">Classifier</text>
      <text x="1052.5" y="478">Tracking</text>
      <text x="1207.5" y="463">Gate +</text><text x="1207.5" y="491">normalise</text>
      <text x="1362.5" y="463">Completion</text><text x="1362.5" y="491">(PCN)</text>
    </g>

    <!-- output -->
    <line x1="1430" y1="470" x2="1466" y2="470" stroke="#3E4C59" stroke-width="4" marker-end="url(#arr)"/>
    <rect x="1470" y="410" width="180" height="120" rx="14" fill="#F3F4F6" stroke="#9AA0A6" stroke-width="3"/>
    <text x="1560" y="463" font-size="24" text-anchor="middle">Completed</text>
    <text x="1560" y="493" font-size="24" text-anchor="middle">cars</text>

    <!-- what feeds the two learned steps -->
    <g stroke="#D9822B" stroke-width="4" marker-end="url(#arrO)">
      <line x1="897.5"  y1="584" x2="897.5"  y2="536"/>
      <line x1="1362.5" y1="584" x2="1362.5" y2="536"/>
    </g>
    <g font-size="24" fill="#D9822B" font-weight="600" text-anchor="middle">
      <text x="897.5"  y="614">auto-mined labels</text>
      <text x="1362.5" y="614">synthetic car shapes</text>
    </g>

    <!-- pros / cons -->
    <g font-size="26">
      <text x="210" y="690"><tspan fill="#2E7D32" font-weight="700">✓</tspan> Every step inspectable</text>
      <text x="610" y="690"><tspan fill="#2E7D32" font-weight="700">✓</tspan> Zero additional manual annotation</text>
      <text x="1170" y="690"><tspan fill="#D7263D" font-weight="700">✗</tspan> Lower peak accuracy</text>
    </g>

    <!-- legend -->
    <g font-size="22" fill="#3E4C59">
      <rect x="1400" y="360" width="22" height="22" rx="4" fill="#DCE8F5" stroke="#2B5C8A" stroke-width="2"/>
      <text x="1430" y="379">classical</text>
      <rect x="1540" y="360" width="22" height="22" rx="4" fill="#FDE6CC" stroke="#D9822B" stroke-width="2"/>
      <text x="1570" y="379">learned</text>
    </g>
  </g>
</svg>
